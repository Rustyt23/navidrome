<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Retail Player</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #05070a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05070a;
      }

      #resonance {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .play-button {
        position: fixed;
        top: 50%;
        left: 50%;
        width: clamp(112px, 18vmin, 176px);
        height: clamp(112px, 18vmin, 176px);
        padding: 0;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(255, 255, 255, 0.42);
        border-radius: 50%;
        color: #fff;
        background: rgba(8, 11, 16, 0.62);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.04) inset,
          0 22px 80px rgba(0, 0, 0, 0.48);
        cursor: pointer;
        opacity: 1;
        transition:
          opacity 320ms ease,
          transform 180ms ease,
          border-color 180ms ease,
          background 180ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .play-button:hover,
      .play-button:focus-visible {
        border-color: rgba(255, 179, 92, 0.88);
        background: rgba(20, 17, 14, 0.78);
        outline: none;
      }

      .play-button:active {
        transform: translate(-50%, -50%) scale(0.96);
      }

      .play-button:disabled {
        cursor: wait;
        opacity: 0.5;
      }

      .play-button svg {
        width: 48%;
        height: 48%;
        margin-left: 7%;
        fill: currentColor;
      }

      .is-playing .play-button {
        opacity: 0;
      }

      .is-playing .play-button:hover,
      .is-playing .play-button:focus-visible {
        opacity: 0.82;
      }

      .is-playing .play-button svg {
        margin-left: 0;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .play-button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="resonance" aria-hidden="true"></canvas>
    <audio id="retail-audio" preload="auto" crossorigin="anonymous"></audio>
    <button
      id="play-button"
      class="play-button"
      type="button"
      aria-label="Play retail device"
    >
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path id="play-icon" d="M20 12 52 32 20 52Z" />
      </svg>
    </button>
    <p id="player-status" class="sr-only" role="status" aria-live="polite">
      Loading retail device
    </p>
    <script type="module" src="../player-assets/player.js"></script>
  </body>
</html>
